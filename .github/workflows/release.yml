name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: diypets-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: diypets-aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: diypets-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path "$stage/assets" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/diypets.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/diypets-settings.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/diypets-creator.exe" "$stage/"
          Copy-Item "README.md","CREDITS.md","LICENSE-MIT","LICENSE-APACHE","catalog.json" "$stage/"
          Copy-Item -Recurse "catalog_icons" "$stage/catalog_icons"
          foreach ($p in @("highland_cow","dog","polar_bear","goat","stegosaurus")) {
            Copy-Item -Recurse "assets/$p" "$stage/assets/$p"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force
      - name: Package Unix tar.gz
        if: runner.os != 'Windows'
        run: |
          stage="stage/${{ matrix.artifact }}"
          mkdir -p "$stage/assets"
          cp "target/${{ matrix.target }}/release/diypets" "$stage/"
          cp "target/${{ matrix.target }}/release/diypets-settings" "$stage/"
          cp "target/${{ matrix.target }}/release/diypets-creator" "$stage/"
          cp README.md CREDITS.md LICENSE-MIT LICENSE-APACHE catalog.json "$stage/"
          cp -r catalog_icons "$stage/catalog_icons"
          for p in highland_cow dog polar_bear goat stegosaurus; do
            cp -r "assets/$p" "$stage/assets/$p"
          done
          tar -czf "${{ matrix.artifact }}.tar.gz" -C stage "${{ matrix.artifact }}"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            diypets-*.zip
            diypets-*.tar.gz