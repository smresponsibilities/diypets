name: Package Manifests CI

on:
  push:
    paths:
      - "packaging/**"
      - "scripts/update_package_manifests.py"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/update_package_manifests.py"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-scoop-and-homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Scoop JSON manifest
        run: |
          python3 -c 'import json; d=json.load(open("packaging/scoop/diypets.json")); assert d["version"] and d["architecture"]["64bit"]["hash"]'
      - name: Validate Homebrew Ruby formula syntax
        run: ruby -c packaging/homebrew/diypets.rb

  validate-winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Winget multi-file manifest
        shell: pwsh
        run: winget validate --manifest packaging/winget
