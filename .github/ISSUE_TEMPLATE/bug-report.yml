name: Bug Report
description: Report a visual glitch, platform issue, or crash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: ["Windows 11 / 10", "macOS (Apple Silicon)", "macOS (Intel)", "Linux (X11)", "Linux (Wayland)"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of `diypets doctor` or latest log in `%APPDATA%\diypets\logs\`
