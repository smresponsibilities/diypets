name: Bug Report
description: Report a crash, visual glitch, or animation/physics bug in DIYPets.
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - diypets (Desktop Runner & Tray)
        - diypets-settings (Settings & Lazy Downloader)
        - diypets-creator (DIYPets Studio)
        - Specific Pet Pack / Animation
        - Build / Packaging
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DIYPets Version / Install Method
      placeholder: "e.g., v0.1.1 via cargo install / GitHub Release zip"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, GIFs, or Logs
      description: Drop screenshots or terminal output here if available.