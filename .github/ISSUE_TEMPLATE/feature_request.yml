name: Feature Request
description: Suggest a new tool for DIYPets Studio, desktop behavior, or quality-of-life improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like DIYPets to do?
      description: Describe the feature and why it would make DIYPets better.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Inspiration / Mockups (Optional)
      description: Links, screenshots, or examples from other apps/editors.